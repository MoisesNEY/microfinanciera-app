server:
  port: 8081

APP_SECURITY_DISABLED: false

spring:
  application:
    name: customer-microservice
  datasource:
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    changelog: "classpath:/db/changelog/changelog-master.yaml"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/microfinance-microservice-realm

# ==========================================
# Perfil DEV
# ==========================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_customer
    username: root
    password: root

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8078/eureka

# ==========================================
# Perfil PROD
# ==========================================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres_main:5432/ms_customer
    username: root
    password: root
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8085/realms/microfinance-microservice-realm

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8078/eureka