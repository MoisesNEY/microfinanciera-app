server:
  port: 8081

APP_SECURITY_DISABLED: true

spring:
  application:
    name: customer-microservice
  datasource:
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    changelog: "classpath:/db/changelog/changelog-master.yaml"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Configuración Jackson para enums - AGREGAR ESTO
  mvc:
    format:
      date: yyyy-MM-dd
  jackson:
    deserialization:
      READ_ENUMS_USING_TO_STRING: true
      READ_UNKNOWN_ENUM_VALUES_AS_NULL: true
      FAIL_ON_UNKNOWN_PROPERTIES: false
    serialization:
      WRITE_ENUMS_USING_TO_STRING: true
      WRITE_DATES_AS_TIMESTAMPS: false


# ==========================================
# Perfil DEV
# ==========================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_customer
    username: root
    password: root

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8078/eureka

# ==========================================
# Perfil PROD
# ==========================================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres_main:5432/ms_customer
    username: root
    password: root

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8078/eureka