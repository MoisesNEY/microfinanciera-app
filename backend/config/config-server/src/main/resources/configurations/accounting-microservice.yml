# ==========================================
# Valores por defecto (comunes a todos los perfiles)
# ==========================================
server:
  port: 8086

APP_SECURITY_DISABLED: false

spring:
  application:
    name: accounting-microservice
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false
      accept-empty-string-as-null-object: true
      read-unknown-enum-values-as-null: true
      accept-float-as-int: true
      use-big-decimal-for-floats: true
    parser:
      allow-numeric-leading-zeros: true
      allow-unquoted-field-names: true
      allow-single-quotes: true
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/microfinance-microservice-realm
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=30m,maximumSize=100


logging:
  level:
    org.springframework: INFO
    com.microfinance: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: ALWAYS

# ==========================================
# ===== CONFIGURACIÓN PARA EXCHANGE RATE SERVICE (NUEVO) =====

exchange-rate:
  bcn:
    wsdl-url: "https://servicios.bcn.gob.ni/Tc_Servicio/ServicioTC.asmx?WSDL"
    timeout: 5000
  banks:
    lafise-url: "https://www.lafise.com/blb/"
    bac-url: "https://www.bac.net/"
    banpro-url: "https://www.banpro.com.ni/"
    scraping-timeout: 5000
  cache:
    ttl-minutes: 30

# ==========================================
# Perfil DEV
# ==========================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/ms_accounting
    username: root
    password: root

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8078/eureka

# ==========================================
# Perfil PROD
# ==========================================
---
spring:
  datasource:
    url: jdbc:postgresql://postgres_main:5432/ms_accounting
    username: root
    password: root
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8085/realms/microfinance-microservice-realm

logging:
  level:
    org.springframework: INFO
    com.microfinance: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: NEVER

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8078/eureka
