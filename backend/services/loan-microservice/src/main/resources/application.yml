spring:
  application:
    name: loan-microservice

# Configuracion para emitir asiento contable al accounting-microservice
accounting:
  service:
    url: http://api-gateway:8080
  accounts:
    # Nombres lógicos de cuentas - se consultan al accounting-microservice para obtener UUIDs
    # Estos nombres son independientes de los códigos numéricos y pueden variar por empresa/ambiente
    cash: "CASH_ACCOUNT"                    # Nombre lógico cuenta caja/banco
    loanReceivable: "LOAN_RECEIVABLE_ACCOUNT" # Nombre lógico cuenta por cobrar prestamos
    interestIncome: "INTEREST_INCOME_ACCOUNT" # Nombre lógico ingreso por intereses
    moratoryIncome: "MORATORY_INCOME_ACCOUNT"  # Nombre lógico ingreso por mora 

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

# ==================== API GATEWAY CONFIGURATION ====================
api:
  gateway:
    url: http://api-gateway:8080  # ← ESTA LÍNEA FALTABA

#==================== CUSTOMER SERVICE CONFIGURATION ====================
customer:
  service:
    url: ${api.gateway.url}  # ← Ahora sí referencia la variable correcta

#==================== WORKER SERVICE CONFIGURATION ====================
worker:
  service:
    url: ${api.gateway.url}  # URL del workers-microservice a través del API Gateway

# ==================== FEIGN CLIENT CONFIGURATION ====================
feign:
  client:
    config:
      api-gateway:  # Nombre debe coincidir con @FeignClient("api-gateway")
        # El interceptor se aplica automáticamente gracias a @Component en FeignRequestInterceptor
