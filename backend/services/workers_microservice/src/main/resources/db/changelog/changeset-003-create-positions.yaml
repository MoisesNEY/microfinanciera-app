databaseChangeLog:
  - changeSet:
      id: 003-create-positions
      author: eduardo
      validCheckSum: 9:4fe2fdc5ed26c369818a3dc4a22d3f61
      changes:
        - createTable:
            tableName: positions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false

              - column:
                  name: realm_role
                  type: varchar(80)

              - column:
                  name: client_role
                  type: varchar(80)

              # 🔥 NUEVO: client_id del cliente donde vive el client_role
              - column:
                  name: client_id
                  type: varchar(200)

              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: positions
            columnNames: department_id, code
            constraintName: uk_positions_department_code

        - addForeignKeyConstraint:
            baseTableName: positions
            baseColumnNames: department_id
            constraintName: fk_positions_department
            referencedTableName: departments
            referencedColumnNames: id
            onDelete: RESTRICT

        # ===== SEEDS POSITIONS (con Realm Role, Client Role y Client Id) =====

        # CREDITOS
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO positions (department_id, code, name, realm_role, client_role, client_id, is_active)
              SELECT d.id, 'ASESOR_CREDITO', 'Asesor de créditos', 'asesor_credito', 'ROLE_USER', 'frontend-client', true
              FROM departments d WHERE d.code = 'CREDITOS';

