databaseChangeLog:
  - changeSet:
      id: create-contact-info-table
      author: moises
      changes:
        - createTable:
            tableName: contact_info
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: client_id, type: UUID, constraints: { nullable: false } }
              - column: { name: contact_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: contact_value, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: is_primary, type: BOOLEAN, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: contact_info
            baseColumnNames: client_id
            referencedTableName: clients
            referencedColumnNames: id
            constraintName: fk_contact_info_client
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE contact_info
              ADD CONSTRAINT chk_contact_info_type CHECK (contact_type IN ('TELEFONO_MOVIL','TELEFONO_FIJO','EMAIL'));
