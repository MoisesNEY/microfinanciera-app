databaseChangeLog:
  - changeSet:
      id: 001-create-clients-table
      author: tu_nombre_de_usuario
      changes:
        - createTable:
            tableName: clients
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: id_document_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: id_document_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: nationality
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: marital_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: true
              - column:
                  name: occupation
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: economic_activity
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: clients