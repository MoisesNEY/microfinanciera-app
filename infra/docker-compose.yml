services:
  postgres_main:
    image: postgres:16
    container_name: mf_postgres_main
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]  
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mfnet]

  config-server:
    build:
      context: ..
      dockerfile: backend/config/config-server/Dockerfile
    ports:
      - "8079:8079"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8079/actuator/health"]
    networks: [mfnet]

  eureka-server:
    build:
      context: ..
      dockerfile: backend/eureka/eureka-server/Dockerfile
    ports:
      - "8078:8078"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8078/actuator/health"]
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8079"
    depends_on:
      config-server:
        condition:
          service_healthy
    networks: [mfnet]
  
  api-gateway:
    build:
      context: ..
      dockerfile: backend/gateway/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8079"
    depends_on:
      eureka-server:
        condition:
          service_healthy
      config-server:
        condition:
          service_healthy   
    networks: [mfnet]
 

  # 🔒 Desactívalo en el primer arranque (o déjalo si ya quieres JWT)
